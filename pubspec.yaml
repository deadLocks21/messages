name: messages
description: "Client SMS/MMS — clone de Google Messages."
publish_to: 'none'

version: 1.1.2+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State / DI
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^16.2.4

  # Préférences locales (épinglage, archivage, thème…)
  shared_preferences: ^2.5.4

  # Accès plateforme
  permission_handler: ^12.0.0
  flutter_contacts: ^1.1.9

  # Appel du correspondant depuis un fil (tel:)
  url_launcher: ^6.3.1

  # Télémétrie : logs OTLP/HTTP vers Signoz
  http: ^1.6.0

  # Divers
  uuid: ^4.5.1
  intl: ^0.20.2
  google_fonts: ^6.2.1

  # Couleurs du système (Material You) : palettes tonales d'Android 12+,
  # couleur d'accentuation ailleurs. Les tons, eux, sont dans `GmTones`.
  dynamic_color: ^1.7.0
  material_color_utilities: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
